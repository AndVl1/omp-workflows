# Release workflow for omp-workflows.
#
# Triggered by pushing a semver tag (v0.2.0, v0.2.0-rc.1). Builds the
# workspace and publishes both publishable packages
# (@omp-workflows/core, then @omp-workflows/fullstack) to GitHub Packages.
#
# Auth: GITHUB_TOKEN is sufficient when publishing into the same GitHub
# organisation's Packages namespace. The `AndVl1/omp-workflows` repo is public,
# so packages are published as `--access public`.
#
# Version handling: this workflow does NOT rewrite package.json. The tag
# (v*.*.*) must match the version already in packages/{core,fullstack}/
# package.json. A guard step fails loudly if not, and prints the bump +
# commit + push commands to fix it. The "npm version" approach fails on the
# first release because devDependencies/internal workspace packages are
# not yet in any registry.
#
# Workspace install: `npm ci` (used by default CI caching) 404s on the first
# release because npm tries to resolve the workspace's internal
# devDependencies against the default registry. We use `npm install`
# (honours workspace symlinks via package-lock.json) until both packages
# are published.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com

      - name: Resolve version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git describe --tags --abbrev=0 --match='v[0-9]*' 2>/dev/null || true)"
            if [ -z "$TAG" ]; then
              echo "No semver tag exists; trigger via push to a v* tag instead." >&2
              exit 1
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version=$VERSION)"

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Build, typecheck, test
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Verify version matches tag
        run: |
          WANTED="${{ steps.version.outputs.version }}"
          for pkg in packages/core packages/fullstack; do
            ACTUAL="$(grep -E '"version"' "$pkg/package.json" | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
            if [ "$ACTUAL" != "$WANTED" ]; then
              echo "::error::$pkg/package.json version is $ACTUAL, but tag is v$WANTED."
              echo "::error::Bump with: cd $pkg && npm version $WANTED --no-git-tag-version --allow-same-version && cd ../.. && git add $pkg/package.json && git commit -m 'chore(release): bump $pkg to v$WANTED' && git push"
              exit 1
            fi
          done
          echo "Verified: both packages report version $WANTED."

      - name: Publish @omp-workflows/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish \
            --registry https://npm.pkg.github.com \
            --access public

      - name: Publish @omp-workflows/fullstack
        working-directory: packages/fullstack
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish \
            --registry https://npm.pkg.github.com \
            --access public

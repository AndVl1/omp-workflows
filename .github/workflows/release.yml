# Release workflow for omp-workflows.
#
# Triggered by pushing a semver tag (v0.2.0, v0.2.0-rc.1). Builds the
# workspace and publishes both publishable packages
# (@omp-workflows/core, then @omp-workflows/fullstack) to GitHub Packages.
#
# Auth: GITHUB_TOKEN is sufficient when publishing into the same GitHub
# organisation's Packages namespace. The `AndVl1/omp-workflows` repo is public,
# so packages are published as `--access public` with provenance attestation
# (requires `id-token: write`).
#
# Local trigger for testing: `gh workflow run release.yml`.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com

      - name: Resolve version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git describe --tags --abbrev=0 --match='v[0-9]*' 2>/dev/null || true)"
            if [ -z "$TAG" ]; then
              echo "No semver tag exists; trigger via push to a v* tag instead." >&2
              exit 1
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version=$VERSION)"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build, typecheck, test
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Stamp @omp-workflows/core version
        working-directory: packages/core
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version \
            --allow-same-version

      - name: Stamp @omp-workflows/fullstack version
        working-directory: packages/fullstack
        run: |
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version \
            --allow-same-version

      - name: Publish @omp-workflows/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish \
            --registry https://npm.pkg.github.com \
            --access public \
            --tag "${{ steps.version.outputs.tag }}"

      - name: Publish @omp-workflows/fullstack
        working-directory: packages/fullstack
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish \
            --registry https://npm.pkg.github.com \
            --access public \
            --tag "${{ steps.version.outputs.tag }}"
